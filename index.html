<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Event Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            margin: 0;
            padding: 40px;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 10px #cccccc;
        }

        h1 {
            color: #0066cc;
        }

        img {
            width: 100%;
            max-width: 400px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }

        #alternateHeading {
            display: none;
            color: #e63946;
        }
    </style>
</head>

<body>

    <div class="container" id="contentArea">
        <h1 id="originalHeading">Welcome to My Webpage</h1>

        <h1 id="alternateHeading">
            You Moved the Mouse!
        </h1>

        <img
            id="myImage"
            src="https://picsum.photos/id/1018/600/400"
            alt="Original landscape image"
        >

        <p>Move your mouse over this area.</p>
    </div>

    <script>
        const contentArea = document.getElementById("contentArea");
        const myImage = document.getElementById("myImage");

        const originalHeading =
            document.getElementById("originalHeading");

        const alternateHeading =
            document.getElementById("alternateHeading");

        // Mouseover event
        contentArea.addEventListener("mouseover", function() {
            myImage.src =
                "https://picsum.photos/id/1015/600/400";

            originalHeading.style.display = "none";
            alternateHeading.style.display = "block";
        });

        // Mouseout event
        contentArea.addEventListener("mouseout", function() {
            myImage.src =
                "https://picsum.photos/id/1018/600/400";

            originalHeading.style.display = "block";
            alternateHeading.style.display = "none";
        });
    </script>

</body>
</html>
